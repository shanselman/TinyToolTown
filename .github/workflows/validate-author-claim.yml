name: Validate Author Page Claim

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  issues: write
  contents: read

jobs:
  validate:
    name: Verify claimant matches GitHub username
    runs-on: ubuntu-latest
    if: >-
      (
        contains(github.event.issue.labels.*.name, 'author-page') ||
        (github.event.action == 'labeled' && github.event.label.name == 'author-page')
      ) &&
      github.event.label.name != 'queued-author' &&
      github.event.label.name != 'needs-maintainer-review' &&
      github.event.label.name != 'author-update-approved'
    steps:
      - uses: actions/checkout@v7

      - name: Validate author-page claim
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {
              parseAuthorClaim,
              validateAuthorClaim,
              renderAuthorMarkdown,
              toolListsAuthor,
            } = require(`${process.env.GITHUB_WORKSPACE}/scripts/author-claim-parser.cjs`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const body = issue.body || '';
            const actor = (issue.user?.login || '').toLowerCase();
            const toolsDir = path.join(process.env.GITHUB_WORKSPACE, 'src', 'content', 'tools');
            const existingSlugs = new Set(
              fs.readdirSync(toolsDir)
                .filter(file => file.endsWith('.md'))
                .map(file => file.replace(/\.md$/, ''))
            );
            const claim = parseAuthorClaim(body, existingSlugs);
            const requested = claim.github;
            const labels = issue.labels.map(label => typeof label === 'string' ? label : label.name);
            const hasInvalid = labels.includes('invalid-author-claim');
            const hasVerified = labels.includes('claim-verified');

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            await ensureLabel('claim-verified', '0e8a16', 'Author-page claim opened by matching GitHub account');
            await ensureLabel('invalid-author-claim', 'd73a4a', 'Author-page claim does not match issue author');
            await ensureLabel('needs-maintainer-review', 'fbca04', 'Ready for maintainer review');
            await ensureLabel('queued-author', '1d76db', 'Approved author page waiting to be written');
            await ensureLabel('author-update-approved', '5319e7', 'Maintainer approved replacing an existing author page');

            if (!requested) {
              if (!hasInvalid) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['invalid-author-claim'] });
              }
              if (hasVerified) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'claim-verified' }).catch(() => {});
              }
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'needs-maintainer-review' }).catch(() => {});
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: '⚠️ I could not find the requested GitHub username in this author-page claim. Please use the **Claim or Customize an Author Page** issue form and include the GitHub username for the page you want to claim.',
              });
              core.setFailed('Missing GitHub username for author-page claim.');
              return;
            }

            if (requested !== actor) {
              if (!hasInvalid) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['invalid-author-claim'] });
              }
              if (hasVerified) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'claim-verified' }).catch(() => {});
              }
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'needs-maintainer-review' }).catch(() => {});
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `⚠️ Author-page claims must be opened from the same GitHub account as the page being claimed.\n\nThis issue was opened by @${actor}, but it requests @${requested}.\n\nIf you are @${requested}, please open a new claim issue while signed in as @${requested}. If this is a special case, a maintainer can review it manually, but this claim is not automatically verified.`,
              });
              core.setFailed(`Claim mismatch: actor ${actor}, requested ${requested}`);
              return;
            }

            if (hasInvalid) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'invalid-author-claim' }).catch(() => {});
            }
            if (!hasVerified) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['claim-verified'] });
            }

            const marker = '<!-- author-claim-verified -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const alreadyCommented = comments.some(comment => comment.body?.includes(marker));
            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `${marker}\n✅ Claim verified: this issue was opened by @${actor} for their own author page. Maintainers can now review the requested profile content.`,
              });
            }

            const toolFiles = fs.readdirSync(toolsDir).filter(file => file.endsWith('.md'));
            const hasAcceptedTool = toolFiles.some(file => {
              const content = fs.readFileSync(path.join(toolsDir, file), 'utf8');
              return toolListsAuthor(content, requested);
            });
            const errors = validateAuthorClaim(claim, hasAcceptedTool);
            const markdown = renderAuthorMarkdown(claim).trimEnd();
            const triageMarker = '<!-- author-claim-triage -->';
            const triageBody = [
              triageMarker,
              `## 👤 Author Claim Triage — @${requested}`,
              '',
              errors.length ? '### ⚠️ Needs information' : '### ✅ Ready for maintainer approval',
              '',
              ...(errors.length ? errors.map(error => `- ${error}`) : []),
              errors.length ? '' : `Add \`queued-author\` to approve, or close to reject.`,
              '',
              `### Proposed \`src/content/authors/${requested}.md\``,
              '```markdown',
              markdown,
              '```',
            ].join('\n');

            const triageComment = comments.find(comment => comment.body?.includes(triageMarker));
            if (triageComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: triageComment.id,
                body: triageBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: triageBody,
              });
            }
            if (errors.length) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: issue.number,
                name: 'needs-maintainer-review',
              }).catch(() => {});
            } else {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: ['needs-maintainer-review'],
              });
            }
