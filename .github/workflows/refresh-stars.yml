name: Refresh Star Counts

on:
  schedule:
    - cron: '0 6,18 * * *'  # Twice daily: 6am and 6pm UTC
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh star counts cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-stars.mjs

      - run: npm ci

      - name: Generate social cards (incremental)
        run: npm run social

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
